# Test, build and publish the anonymizer to https://bergwriting.github.io/
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # End-to-end check of the built file (runner's preinstalled Chrome, all network blocked)
      - run: npm run fixtures && npm run e2e
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/essay-anonymizer.html _site/index.html
          # same file, for people who want to save a copy and run it offline
          cp dist/essay-anonymizer.html _site/essay-anonymizer.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
